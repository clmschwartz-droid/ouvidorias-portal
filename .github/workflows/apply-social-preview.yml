name: Aplicar metadados de compartilhamento social

on:
  push:
    branches: [social-preview]
    paths:
      - '.github/workflows/apply-social-preview.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social-preview
      - name: Adiciona Open Graph e Twitter Cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'property="og:image"' in s:
              raise SystemExit(0)
          needle = '''    <title>Portal das Ouvidorias Públicas do Brasil</title>\n    <link rel="icon" type="image/png" href="favicon-ouvidorias.png">\n'''
          insert = '''    <title>Portal das Ouvidorias Públicas do Brasil</title>\n    <link rel="icon" type="image/png" href="favicon-ouvidorias.png">\n    <meta name="description" content="História, fundamentos, legislação, acervo e mapa das ouvidorias públicas brasileiras.">\n    <link rel="canonical" href="https://ouvidoriasbrasileiras.com.br/">\n\n    <!-- Prévia para WhatsApp e redes sociais -->\n    <meta property="og:type" content="website">\n    <meta property="og:url" content="https://ouvidoriasbrasileiras.com.br/">\n    <meta property="og:title" content="Portal das Ouvidorias Públicas do Brasil">\n    <meta property="og:description" content="História, fundamentos, legislação, acervo e mapa das ouvidorias públicas brasileiras.">\n    <meta property="og:image" content="https://ouvidoriasbrasileiras.com.br/favicon-ouvidorias.png">\n    <meta property="og:image:secure_url" content="https://ouvidoriasbrasileiras.com.br/favicon-ouvidorias.png">\n    <meta property="og:image:type" content="image/png">\n    <meta property="og:image:width" content="2863">\n    <meta property="og:image:height" content="3508">\n    <meta property="og:image:alt" content="Marca das Ouvidorias Públicas Brasileiras">\n\n    <meta name="twitter:card" content="summary_large_image">\n    <meta name="twitter:title" content="Portal das Ouvidorias Públicas do Brasil">\n    <meta name="twitter:description" content="História, fundamentos, legislação, acervo e mapa das ouvidorias públicas brasileiras.">\n    <meta name="twitter:image" content="https://ouvidoriasbrasileiras.com.br/favicon-ouvidorias.png">\n'''
          if needle not in s:
              raise SystemExit('Cabeçalho esperado não encontrado; nenhuma alteração feita.')
          p.write_text(s.replace(needle, insert, 1), encoding='utf-8')
          PY
      - name: Commit da alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona prévia social com a marca original"
          git push origin HEAD:social-preview
