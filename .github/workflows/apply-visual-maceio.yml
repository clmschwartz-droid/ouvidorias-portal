name: Aplicar ajuste responsivo do mapa

on:
  push:
    branches: [visual-maceio]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-map-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: visual-maceio

      - name: Aplicar experiência compacta do mapa
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('visual-maceio.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* MAPA MOBILE — bottom sheet 2026-08-23 */'
          if marker in s:
              print('Ajuste já aplicado.')
              raise SystemExit(0)

          s += r'''

/* MAPA MOBILE — bottom sheet 2026-08-23 */
/* Em telas compactas, o mapa continua visível e os dados do estado viram uma gaveta rolável. */
@media (max-width: 767px), (max-height: 620px) and (max-width: 1100px) {
  #mapa {
    height: auto !important;
    min-height: 100% !important;
    flex-direction: column !important;
    overflow: visible !important;
    position: relative;
    padding-bottom: 1rem;
  }

  #mapa > div:first-child {
    width: 100% !important;
    flex: none !important;
    padding: .9rem !important;
    border-right: 0 !important;
    border-bottom: 1px solid var(--opb-line) !important;
  }

  /* Atalhos superiores em uma faixa horizontal, sem roubar altura do mapa. */
  #mapa > div:first-child > div:first-child {
    display: flex !important;
    grid-template-columns: none !important;
    gap: .5rem !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    margin-bottom: .75rem !important;
    padding: 0 0 .25rem 0;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  #mapa > div:first-child > div:first-child::-webkit-scrollbar { display: none; }
  #mapa > div:first-child > div:first-child .actbtn {
    flex: 0 0 min(78vw, 300px) !important;
    scroll-snap-align: start;
    min-height: 58px;
  }

  #mapa > div:first-child > div:nth-child(2) { margin-bottom: .55rem !important; }
  #mapa > div:first-child > div:nth-child(2) h2 { font-size: 1rem !important; }
  #mapa > div:first-child > div:nth-child(2) p { font-size: .72rem !important; }

  #mapa-canvas {
    flex: none !important;
    width: 100% !important;
    min-height: 270px !important;
    height: clamp(270px, 41dvh, 330px) !important;
    max-height: 330px;
  }

  #mapa > div:nth-child(2) {
    width: 100% !important;
    min-height: 0 !important;
    overflow: visible !important;
    background: transparent !important;
  }

  /* A instrução inicial deixa de ocupar uma segunda tela inteira. */
  #mapa-vazio { display: none !important; }

  /* Estado selecionado: gaveta inferior independente, com rolagem própria. */
  #mapa-painel {
    position: fixed !important;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100% !important;
    height: min(64dvh, 560px) !important;
    max-height: calc(100dvh - 86px) !important;
    z-index: 40;
    background: var(--opb-paper) !important;
    border: 1px solid var(--opb-line);
    border-bottom: 0;
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -18px 52px rgba(17,19,19,.20);
    overflow: hidden !important;
  }
  #mapa-painel.hidden { display: none !important; }
  #mapa-painel.flex { display: flex !important; }

  #mapa-painel > div:first-child {
    padding: .9rem 1rem .75rem !important;
    border-radius: 22px 22px 0 0;
    flex: none;
  }
  #mapa-painel > div:first-child::before {
    content: '';
    display: block;
    width: 42px;
    height: 4px;
    border-radius: 999px;
    background: #b9c2c1;
    margin: -.25rem auto .65rem;
  }
  #mapa-painel #mp_estado { font-size: 1rem !important; }
  #mapa-painel #mp_meta { font-size: .68rem !important; line-height: 1.35; }
  #mapa-painel .tabbtn {
    min-height: 40px;
    padding-left: .35rem;
    padding-right: .35rem;
    line-height: 1.15;
  }
  #mapa-conteudo {
    padding: .85rem !important;
    padding-bottom: calc(.9rem + env(safe-area-inset-bottom)) !important;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
}

/* Celular deitado: mantém a lógica móvel, evitando que o breakpoint por largura o transforme em desktop. */
@media (orientation: landscape) and (max-height: 620px) and (max-width: 1100px) {
  body {
    flex-direction: column !important;
  }
  body > nav {
    width: 100% !important;
    height: auto !important;
    min-height: 0 !important;
    flex: none !important;
    border-right: 0 !important;
    border-bottom: 1px solid rgba(255,255,255,.08) !important;
    box-shadow: 0 8px 24px rgba(17,19,19,.13) !important;
  }
  body > nav > div:first-child,
  body > nav > div:last-child { display: none !important; }
  body > nav > div:nth-child(2) {
    flex: none !important;
    flex-direction: row !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    padding: .35rem .5rem !important;
    gap: .3rem !important;
    scrollbar-width: none;
  }
  body > nav > div:nth-child(2)::-webkit-scrollbar { display: none; }
  body > nav > div:nth-child(2) > div { display: none !important; }
  body > nav .nav-link {
    flex: 0 0 auto !important;
    border-radius: 999px !important;
    padding: .5rem .7rem !important;
    min-height: 38px;
    transform: none !important;
  }
  body > nav .nav-link span { display: inline !important; font-size: .72rem; }

  #main-content { min-height: 0 !important; }
  #mapa { min-height: 100% !important; }
  #mapa > div:first-child { padding: .55rem .75rem .7rem !important; }
  #mapa > div:first-child > div:first-child {
    margin-bottom: .35rem !important;
  }
  #mapa > div:first-child > div:first-child .actbtn {
    flex-basis: 220px !important;
    min-height: 48px;
    padding-top: .45rem !important;
    padding-bottom: .45rem !important;
  }
  #mapa > div:first-child > div:nth-child(2) { margin-bottom: .25rem !important; }
  #mapa-canvas {
    min-height: 190px !important;
    height: 49dvh !important;
    max-height: 240px !important;
  }
  #mapa > div:first-child > p:last-child { margin-top: .15rem !important; }
  #mapa-painel {
    height: 58dvh !important;
    max-height: 58dvh !important;
    border-radius: 18px 18px 0 0;
  }
  #mapa-painel > div:first-child {
    padding: .55rem .9rem .5rem !important;
    border-radius: 18px 18px 0 0;
  }
  #mapa-painel > div:first-child::before { margin-bottom: .35rem; }
  #mapa-painel .tabbtn { min-height: 34px; padding-top: .3rem; padding-bottom: .3rem; }
  #mapa-conteudo { padding: .65rem .8rem !important; }
}
'''
          p.write_text(s, encoding='utf-8')
          print('Ajuste responsivo do mapa aplicado.')
          PY

      - name: Validar
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('visual-maceio.css').read_text(encoding='utf-8')
          required = [
            '/* MAPA MOBILE — bottom sheet 2026-08-23 */',
            '#mapa-painel',
            'height: min(64dvh, 560px)',
            'orientation: landscape',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Validação falhou: ' + ', '.join(missing))
          print('CSS móvel validado.')
          PY

      - name: Commit
        run: |
          if git diff --quiet -- visual-maceio.css; then
            echo "Nada a alterar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-maceio.css
          git commit -m "Melhora navegação do mapa em celulares"
          git push origin visual-maceio
