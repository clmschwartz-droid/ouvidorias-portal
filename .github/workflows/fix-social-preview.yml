name: Corrigir prévia social

on:
  push:
    branches: [social-preview-fix]
    paths:
      - '.github/workflows/fix-social-preview.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social-preview-fix

      - name: Criar imagem social adequada
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert -size 1200x630 xc:'#f6f6f3' \
            favicon-ouvidorias.png -resize 360x440 \
            -gravity center -composite \
            -strip -quality 84 social-card.jpg
          identify social-card.jpg
          test "$(stat -c%s social-card.jpg)" -lt 300000

      - name: Atualizar metadados Open Graph
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://ouvidoriasbrasileiras.com.br/favicon-ouvidorias.png'
          new = 'https://ouvidoriasbrasileiras.com.br/social-card.jpg?v=2'
          s = s.replace(old, new)
          s = s.replace('<meta property="og:image:type" content="image/png">', '<meta property="og:image:type" content="image/jpeg">')
          s = s.replace('<meta property="og:image:width" content="2863">', '<meta property="og:image:width" content="1200">')
          s = s.replace('<meta property="og:image:height" content="3508">', '<meta property="og:image:height" content="630">')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit da correção
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html social-card.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Corrige imagem da prévia social"
          git push origin HEAD:social-preview-fix
