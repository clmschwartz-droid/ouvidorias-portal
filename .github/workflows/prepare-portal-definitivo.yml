name: Preparar portal definitivo

on:
  push:
    branches:
      - portal-definitivo
    paths:
      - .github/workflows/prepare-portal-definitivo.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portal-definitivo

      - name: Aplicar patch estrutural
        run: python tools/patch_portal_definitivo.py

      - name: Validar alterações
        run: |
          grep -q 'data-target="fala-ouvidor"' index.html
          grep -q 'id="noticias-dinamicas"' index.html
          grep -q 'id="documentos-recentes-section"' index.html
          grep -q 'id="documentos-internacionais-dinamicos"' index.html
          grep -q 'id="multimidia-dinamica"' index.html
          grep -q 'portal-content.js' index.html

      - name: Commit das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Prepara estrutura definitiva do portal"
          git push origin HEAD:portal-definitivo
