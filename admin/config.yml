backend:
  name: github
  repo: clmschwartz-droid/ouvidorias-portal
  # O CMS público usa a branch protegida main; cada publicação segue o fluxo editorial por pull request.
  branch: main
  # O portal continua no GitHub Pages; o Netlify é usado apenas como ponte OAuth.
  # O domínio canônico também está cadastrado no projeto Netlify para autorizar o retorno do login.
  site_domain: ouvidoriasbrasileiras.com.br

publish_mode: editorial_workflow
locale: pt

media_folder: "uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "noticias"
    label: "Notícias e Cursos"
    files:
      - name: "itens"
        label: "Itens publicados"
        file: "conteudo/noticias.json"
        format: "json"
        fields:
          - label: "Notícias, cursos e eventos"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            hint: "Para retirar um item temporariamente, desative “Exibir no portal”. Use o X somente quando a exclusão permanente for realmente desejada."
            fields:
              - { label: "Tipo", name: "tipo", widget: "select", options: ["Notícia", "Artigo", "Curso", "Evento"] }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Data", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Exibir no portal", name: "publicado", widget: "boolean", required: false, default: true, hint: "Desative para ocultar sem excluir; o conteúdo e os arquivos permanecem preservados." }
              - { label: "Subtítulo ou linha fina", name: "subtitulo", widget: "string", required: false }
              - { label: "Texto", name: "texto", widget: "text", required: false }
              - { label: "Autor ou autora", name: "autor", widget: "string", required: false }
              - { label: "Veículo ou organizador", name: "fonte", widget: "string", required: false }
              - { label: "Local", name: "local", widget: "string", required: false }
              - { label: "Link externo principal", name: "link", widget: "string", required: false, hint: "URL completa, começando por https://" }
              - { label: "Texto do link externo principal", name: "link_label", widget: "string", required: false, default: "Acessar fonte" }
              - { label: "Abrir link principal em nova aba", name: "link_nova_aba", widget: "boolean", required: false, default: true }
              - label: "Links relacionados"
                name: "links"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                hint: "Use para documentos ou páginas complementares relacionados à notícia."
                fields:
                  - { label: "Texto do link", name: "label", widget: "string" }
                  - { label: "URL ou caminho", name: "url", widget: "string" }
                  - { label: "Abrir em nova aba", name: "nova_aba", widget: "boolean", required: false, default: true }
                  - { label: "Fazer download ao clicar", name: "download", widget: "boolean", required: false, default: false, hint: "Ative para PDFs e outros arquivos que devem ser baixados diretamente." }
              - label: "Imagem ou banner"
                name: "imagem"
                widget: "image"
                required: false
                media_folder: "/noticias"
                public_folder: "/noticias"
                hint: "Padrão recomendado: 1200 × 630 px (proporção aproximada 1,9:1), JPG/PNG/WebP, preferencialmente até 800 KB. O portal preserva a proporção da imagem e não faz corte automático."
              - { label: "Texto alternativo da imagem", name: "imagem_alt", widget: "string", required: false, hint: "Descreva objetivamente o conteúdo essencial da imagem para acessibilidade." }
              - { label: "Legenda da imagem", name: "imagem_legenda", widget: "string", required: false }
              - label: "PDF ou arquivo principal"
                name: "arquivo"
                widget: "file"
                required: false
                media_folder: "/documentos"
                public_folder: "/documentos"
              - { label: "Texto do botão de download", name: "arquivo_label", widget: "string", required: false, default: "Baixar arquivo" }
              - { label: "Exibir como destaque", name: "destaque", widget: "boolean", required: false, default: false, hint: "Use em um único item por vez: ele ocupará o card principal da capa. Se nenhum item estiver marcado, a notícia mais recente assumirá automaticamente o destaque." }
              - { label: "Identificador técnico substituído", name: "substitui", widget: "hidden", required: false, default: "" }

  - name: "documentos"
    label: "Documentos"
    files:
      - name: "itens"
        label: "Documentos do portal"
        file: "conteudo/documentos.json"
        format: "json"
        fields:
          - label: "Documentos"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            hint: "Para retirar um item temporariamente, desative “Exibir no portal”. Use o X somente quando a exclusão permanente for realmente desejada."
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Tipo", name: "tipo", widget: "string", required: false }
              - { label: "Categoria", name: "categoria", widget: "select", options: ["Carta", "Moção", "Documentos internacionais", "Documentos históricos", "Outro"], required: false }
              - { label: "Data", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD", required: false }
              - { label: "Exibir no portal", name: "publicado", widget: "boolean", required: false, default: true, hint: "Desative para ocultar sem excluir; o conteúdo e os arquivos permanecem preservados." }
              - { label: "Descrição", name: "descricao", widget: "text", required: false }
              - { label: "Fonte ou instituição", name: "fonte", widget: "string", required: false }
              - { label: "Exibir em Documentos recentes", name: "recente", widget: "boolean", required: false, default: false }
              - label: "PDF ou arquivo"
                name: "arquivo"
                widget: "file"
                required: false
                media_folder: "/documentos"
                public_folder: "/documentos"
              - { label: "Texto do botão de download", name: "arquivo_label", widget: "string", required: false, default: "Baixar documento" }
              - label: "Links oficiais"
                name: "links"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Texto do link", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "Abrir em nova aba", name: "nova_aba", widget: "boolean", required: false, default: true }
                  - { label: "Fazer download ao clicar", name: "download", widget: "boolean", required: false, default: false }

  - name: "multimidia"
    label: "Multimídia"
    files:
      - name: "itens"
        label: "Vídeos, podcasts e entrevistas"
        file: "conteudo/multimidia.json"
        format: "json"
        fields:
          - label: "Conteúdos multimídia"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            hint: "Para retirar um item temporariamente, desative “Exibir no portal”. Use o X somente quando a exclusão permanente for realmente desejada."
            fields:
              - { label: "Tipo", name: "tipo", widget: "select", options: ["Vídeo", "Podcast", "Entrevista", "Áudio", "Galeria de fotos", "Outro"] }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Data", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD", required: false }
              - { label: "Exibir no portal", name: "publicado", widget: "boolean", required: false, default: true, hint: "Desative para ocultar sem excluir; o conteúdo e os arquivos permanecem preservados." }
              - { label: "Descrição", name: "descricao", widget: "text", required: false }
              - { label: "Fonte ou instituição", name: "fonte", widget: "string", required: false }
              - { label: "Plataforma", name: "plataforma", widget: "string", required: false, hint: "Ex.: UN Web TV, YouTube, Spotify" }
              - { label: "Duração", name: "duracao", widget: "string", required: false }
              - { label: "URL oficial", name: "url", widget: "string", hint: "Página oficial do vídeo, episódio, áudio, entrevista ou galeria." }
              - { label: "URL de incorporação", name: "embed_url", widget: "string", required: false, hint: "Para vídeos exibidos dentro do portal. Cole a URL do player (src do iframe); links comuns do YouTube e do Vimeo também são convertidos automaticamente." }
              - { label: "Texto do link", name: "link_label", widget: "string", required: false, default: "Acessar conteúdo" }
              - { label: "Abrir link em nova aba", name: "nova_aba", widget: "boolean", required: false, default: true }
              - label: "Imagem estática / thumbnail"
                name: "imagem"
                widget: "image"
                required: false
                media_folder: "/multimidia"
                public_folder: "/multimidia"
                hint: "Recomendado: 1280 × 720 px ou outra imagem em proporção 16:9."
              - { label: "Texto alternativo da imagem", name: "imagem_alt", widget: "string", required: false }
              - { label: "Destaque", name: "destaque", widget: "boolean", required: false, default: false }

  - name: "manifestacoes"
    label: "Fala Ouvidor — publicações"
    files:
      - name: "itens"
        label: "Manifestações moderadas"
        file: "conteudo/manifestacoes.json"
        format: "json"
        fields:
          - label: "Manifestações aprovadas para publicação"
            name: "items"
            widget: "list"
            required: false
            summary: "{{fields.date}} — {{fields.title}}"
            hint: "Inclua somente a versão já moderada, revisada e autorizada. Nunca registre e-mail, telefone, documentos privados ou o relato original. Para ocultar sem apagar, desative “Publicado”; use o X apenas para exclusão permanente."
            fields:
              - { label: "Título público", name: "title", widget: "string" }
              - { label: "Data de publicação", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Categoria", name: "categoria", widget: "select", options: ["Interrupção de mandato", "Afastamento ou demissão", "Prejuízo ao funcionamento de ouvidoria", "Relato institucional", "Sugestão ou atualização", "Outro"] }
              - { label: "Ouvidoria, órgão ou instituição", name: "instituicao", widget: "string", required: false }
              - { label: "Local ou UF", name: "local", widget: "string", required: false }
              - { label: "Texto público moderado", name: "texto", widget: "text", hint: "Revise o texto e remova dados pessoais ou alegações que não devam ser publicadas." }
              - { label: "Identificação pública", name: "autor_exibicao", widget: "string", required: false, default: "Identidade preservada", hint: "Use o nome autorizado, iniciais ou “Identidade preservada”." }
              - { label: "Situação", name: "status", widget: "select", options: ["Relato publicado", "Em acompanhamento", "Resposta recebida", "Encerrado"], required: false, default: "Relato publicado" }
              - { label: "Resposta ou atualização", name: "resposta", widget: "text", required: false }
              - { label: "Data da resposta", name: "resposta_data", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD", required: false }
              - { label: "Exibir como destaque", name: "destaque", widget: "boolean", required: false, default: false }
              - { label: "Publicado", name: "publicado", widget: "boolean", required: false, default: true, hint: "Desative para retirar temporariamente a manifestação da página sem apagar o registro editorial." }

  - name: "conselho_curador"
    label: "Conselho Curador"
    files:
      - name: "integrantes"
        label: "Integrantes"
        file: "conteudo/conselho-curador.json"
        format: "json"
        fields:
          - label: "Pessoas e instituições"
            name: "items"
            widget: "list"
            required: false
            summary: "{{fields.nome}} — {{fields.entidade}}"
            hint: "Os integrantes só aparecem quando também for ativada a publicação geral em “Configuração do portal”. Use o X apenas para exclusão permanente."
            fields:
              - { label: "Nome", name: "nome", widget: "string" }
              - { label: "Entidade", name: "entidade", widget: "string" }
              - { label: "Função ou vínculo", name: "funcao", widget: "string", required: false }
              - { label: "Nota biográfica", name: "bio", widget: "text", required: false }
              - { label: "Link institucional", name: "link", widget: "string", required: false, hint: "URL completa, começando por https://" }
              - { label: "Ordem de exibição", name: "ordem", widget: "number", value_type: "int", min: 1, required: false }
              - { label: "Exibir no portal", name: "ativo", widget: "boolean", required: false, default: true }

  - name: "configuracao"
    label: "Configuração do portal"
    files:
      - name: "geral"
        label: "Publicação e recursos futuros"
        file: "conteudo/configuracao.json"
        format: "json"
        fields:
          - { label: "Publicar Conselho Curador", name: "conselho_publicado", widget: "boolean", required: false, default: false, hint: "Mantenha desativado até que todos os integrantes tenham autorizado a divulgação." }
          - { label: "Ativar pop-up da newsletter", name: "newsletter_ativa", widget: "boolean", required: false, default: false, hint: "Só ative depois de informar uma URL pública válida da newsletter." }
          - { label: "Título da newsletter", name: "newsletter_titulo", widget: "string", required: false, default: "Acompanhe as novidades do portal" }
          - { label: "Texto da newsletter", name: "newsletter_texto", widget: "text", required: false, default: "Receba novas publicações, documentos e atualizações do Portal das Ouvidorias Públicas do Brasil." }
          - { label: "URL para inscrição", name: "newsletter_url", widget: "string", required: false, hint: "Cole a URL pública completa do Substack ou do serviço que vier a ser adotado." }
          - { label: "Texto do botão", name: "newsletter_botao", widget: "string", required: false, default: "Assinar newsletter" }
          - { label: "Atraso para exibição (segundos)", name: "newsletter_atraso_segundos", widget: "number", value_type: "int", min: 0, max: 60, required: false, default: 8 }
          - { label: "Versão do aviso", name: "newsletter_versao", widget: "string", required: false, default: "1", hint: "Altere este valor quando quiser que o pop-up volte a aparecer para quem já o dispensou." }
